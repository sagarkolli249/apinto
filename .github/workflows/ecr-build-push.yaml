name: Build and Push to ECR with Semantic Versioning

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  AWS_REGION: us-east-1
  ECR_PRIVATE_REPOSITORY: apipark/apinto  # Private ECR repository
  ECR_PUBLIC_REPOSITORY: apinto  # Public ECR repository
  PUBLIC_REGISTRY_ALIAS: e5v3y2z9  # Your public ECR registry alias

jobs:
  # Semantic versioning job - determines the next version
  semantic-version:
    name: Determine Semantic Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      should_release: ${{ steps.semver.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for semantic versioning
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        run: |
          npm install -g semantic-release@23 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/github@10 \
            @semantic-release/commit-analyzer@11 \
            @semantic-release/release-notes-generator@12 \
            conventional-changelog-conventionalcommits@7

      - name: Run semantic-release (dry-run)
        id: semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run semantic-release in dry-run mode to get next version
          npx semantic-release --dry-run --no-ci > semver-output.txt 2>&1 || true

          # Extract version from output
          NEXT_VERSION=$(cat semver-output.txt | grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")

          if [ -z "$NEXT_VERSION" ]; then
            # If no new version, get the latest tag
            NEXT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.1.0")
            NEXT_VERSION=${NEXT_VERSION#v}
            SHOULD_RELEASE="false"
            echo "No new version to release, using existing: $NEXT_VERSION"
          else
            SHOULD_RELEASE="true"
            echo "New version to release: $NEXT_VERSION"
          fi

          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

          echo "Version: $NEXT_VERSION"
          echo "Tag: v$NEXT_VERSION"
          echo "Should Release: $SHOULD_RELEASE"

  # Build and push Docker images to ECR
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: semantic-version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'

      - name: Go mod tidy
        run: go mod tidy

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build binary and create tarball
        env:
          VERSION: ${{ needs.semantic-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          chmod +x build/cmd/*.sh
          ./build/cmd/package.sh ${VERSION} ${ARCH}

      - name: Prepare Docker build context
        env:
          VERSION: ${{ needs.semantic-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          PackageName=apinto_${VERSION}_linux_${ARCH}.tar.gz
          cp out/${PackageName} ./build/resources/apinto.linux.x64.tar.gz

      - name: Login to Amazon ECR Public
        id: login-ecr-public
        run: |
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/${{ env.PUBLIC_REGISTRY_ALIAS }}

      - name: Build and push Docker images
        env:
          ECR_PRIVATE_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_PUBLIC_REGISTRY: public.ecr.aws/${{ env.PUBLIC_REGISTRY_ALIAS }}
          VERSION: ${{ needs.semantic-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          PLATFORM="linux/$ARCH"

          # Determine tag suffix: amd64 gets no suffix (default), arm64 gets -arm64
          if [ "$ARCH" = "amd64" ]; then
            TAG_SUFFIX=""
          else
            TAG_SUFFIX="-${ARCH}"
          fi

          # Private ECR image tags
          PRIVATE_IMAGE_VERSIONED="${ECR_PRIVATE_REGISTRY}/${{ env.ECR_PRIVATE_REPOSITORY }}:${VERSION}${TAG_SUFFIX}"
          PRIVATE_IMAGE_LATEST="${ECR_PRIVATE_REGISTRY}/${{ env.ECR_PRIVATE_REPOSITORY }}:latest${TAG_SUFFIX}"

          # Public ECR image tags
          PUBLIC_IMAGE_VERSIONED="${ECR_PUBLIC_REGISTRY}/${{ env.ECR_PUBLIC_REPOSITORY }}:${VERSION}${TAG_SUFFIX}"
          PUBLIC_IMAGE_LATEST="${ECR_PUBLIC_REGISTRY}/${{ env.ECR_PUBLIC_REPOSITORY }}:latest${TAG_SUFFIX}"

          # Build image
          docker build \
            --platform=${PLATFORM} \
            -t ${PRIVATE_IMAGE_VERSIONED} \
            -t ${PRIVATE_IMAGE_LATEST} \
            -t ${PUBLIC_IMAGE_VERSIONED} \
            -t ${PUBLIC_IMAGE_LATEST} \
            -f ./build/cmd/Dockerfile \
            ./build/resources

          # Push to private ECR
          docker push ${PRIVATE_IMAGE_VERSIONED}
          docker push ${PRIVATE_IMAGE_LATEST}
          echo "✅ Pushed to private ECR: ${PRIVATE_IMAGE_VERSIONED}"
          echo "✅ Pushed to private ECR: ${PRIVATE_IMAGE_LATEST}"

          # Push to public ECR
          docker push ${PUBLIC_IMAGE_VERSIONED}
          docker push ${PUBLIC_IMAGE_LATEST}
          echo "✅ Pushed to public ECR: ${PUBLIC_IMAGE_VERSIONED}"
          echo "✅ Pushed to public ECR: ${PUBLIC_IMAGE_LATEST}"

      - name: Cleanup
        run: |
          rm -rf ./build/resources/apinto.linux.x64.tar.gz

  # Create multi-arch manifest (disabled - images already tagged with latest)
  # Uncomment and update if you need unified multi-arch manifests
  # create-manifest:
  #   name: Create Multi-Arch Manifest
  #   runs-on: ubuntu-latest
  #   needs: [semantic-version, build-and-push]
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   steps:
  #     - name: Configure AWS credentials
  #       uses: aws-actions/configure-aws-credentials@v4
  #       with:
  #         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
  #         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  #         aws-region: ${{ env.AWS_REGION }}
  #
  #     - name: Login to Amazon ECR
  #       id: login-ecr
  #       uses: aws-actions/amazon-ecr-login@v2
  #
  #     - name: Login to Amazon ECR Public
  #       run: |
  #         aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/${{ env.PUBLIC_REGISTRY_ALIAS }}
  #
  #     - name: Create and push multi-arch manifests
  #       env:
  #         ECR_PRIVATE_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
  #         ECR_PUBLIC_REGISTRY: public.ecr.aws/${{ env.PUBLIC_REGISTRY_ALIAS }}
  #         VERSION: ${{ needs.semantic-version.outputs.version }}
  #       run: |
  #         # Create manifests for private ECR
  #         docker manifest create \
  #           ${ECR_PRIVATE_REGISTRY}/${{ env.ECR_PRIVATE_REPOSITORY }}:${VERSION} \
  #           ${ECR_PRIVATE_REGISTRY}/${{ env.ECR_PRIVATE_REPOSITORY }}:${VERSION}-amd64 \
  #           ${ECR_PRIVATE_REGISTRY}/${{ env.ECR_PRIVATE_REPOSITORY }}:${VERSION}-arm64
  #
  #         docker manifest push ${ECR_PRIVATE_REGISTRY}/${{ env.ECR_PRIVATE_REPOSITORY }}:${VERSION}
  #
  #         # Create manifests for public ECR
  #         docker manifest create \
  #           ${ECR_PUBLIC_REGISTRY}/${{ env.ECR_PUBLIC_REPOSITORY }}:${VERSION} \
  #           ${ECR_PUBLIC_REGISTRY}/${{ env.ECR_PUBLIC_REPOSITORY }}:${VERSION}-amd64 \
  #           ${ECR_PUBLIC_REGISTRY}/${{ env.ECR_PUBLIC_REPOSITORY }}:${VERSION}-arm64
  #
  #         docker manifest push ${ECR_PUBLIC_REGISTRY}/${{ env.ECR_PUBLIC_REPOSITORY }}:${VERSION}

  # Update Helm chart versions
  update-helm-versions:
    name: Update Helm Chart Versions
    runs-on: ubuntu-latest
    needs: [semantic-version, build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update helm chart versions
        env:
          VERSION: ${{ needs.semantic-version.outputs.version }}
        run: |
          # Update apinto subchart version and appVersion
          sed -i "s/^version:.*/version: ${VERSION}/" helm-chart/charts/apinto/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" helm-chart/charts/apinto/Chart.yaml

          # Update apinto image tag in values.yaml
          sed -i "s/^tag:.*/tag: ${VERSION}/" helm-chart/charts/apinto/values.yaml

          # Update main chart version
          sed -i "s/^version:.*/version: ${VERSION}/" helm-chart/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" helm-chart/Chart.yaml

          # Update apinto dependency version in main chart
          sed -i "/name: apinto/,/condition:/ s/version:.*/version: ${VERSION}/" helm-chart/Chart.yaml

      - name: Commit version updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add helm-chart/Chart.yaml helm-chart/charts/apinto/Chart.yaml helm-chart/charts/apinto/values.yaml
          git diff --staged --quiet || git commit -m "chore: bump helm chart versions to ${{ needs.semantic-version.outputs.version }} [skip ci]"
          git push

  # Release with semantic versioning
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [semantic-version, build-and-push, update-helm-versions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.semantic-version.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        run: |
          npm install -g semantic-release@23 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/github@10 \
            @semantic-release/commit-analyzer@11 \
            @semantic-release/release-notes-generator@12 \
            conventional-changelog-conventionalcommits@7

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Output release info
        env:
          VERSION: ${{ needs.semantic-version.outputs.version }}
          TAG: ${{ needs.semantic-version.outputs.tag }}
        run: |
          echo "🎉 Released version $VERSION with tag $TAG"
          echo "📦 Docker images available at:"
          echo "   - ${ECR_REPOSITORY}:${VERSION}"
          echo "   - ${ECR_REPOSITORY}:latest"

  # Deploy to Kubernetes using Helm
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [semantic-version, build-and-push, update-helm-versions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install
          fi
          aws --version

      - name: Configure kubeconfig from GitHub Secret
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Validate cluster access
        run: |
          kubectl version --client
          kubectl get ns

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Deploy apinto as separate release
        env:
          VERSION: ${{ needs.semantic-version.outputs.version }}
          NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
        run: |
          # Deploy apinto subchart as its own separate helm release
          # This is completely independent from the parent apipark release
          helm upgrade --install apipark-apinto ./helm-chart/charts/apinto \
            --namespace ${NAMESPACE} \
            --create-namespace \
            --set image=public.ecr.aws/${{ env.PUBLIC_REGISTRY_ALIAS }}/${{ env.ECR_PUBLIC_REPOSITORY }} \
            --set tag=${VERSION} \
            --wait \
            --timeout 10m

      - name: Verify deployment
        env:
          NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
        run: |
          kubectl rollout status statefulset/apipark-apinto-apinto -n ${NAMESPACE} --timeout=10m
          kubectl get statefulset,pods,svc -n ${NAMESPACE} | grep apinto
