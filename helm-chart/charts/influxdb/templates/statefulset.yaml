apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-influxdb
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8086
      name: http
  selector:
    app: {{ .Release.Name }}-influxdb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-influxdb
spec:
  serviceName: {{ .Release.Name }}-influxdb
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-influxdb
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-influxdb
    spec:
      serviceAccountName: {{ .Values.global.serviceAccountName | default "apipark-sa" }}
      containers:
        - name: influxdb
          image: {{ .Values.image }}
          envFrom:
            - secretRef:
                name: {{ .Values.global.externalSecretName | default "apipark-app-secrets" }}
          env:
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: setup
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: apipark-app-secrets
                  key: APIPARK_ADMIN_USER
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apipark-app-secrets
                  key: APIPARK_ADMIN_PASSWORD
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: apipark
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: apipark
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apipark-app-secrets
                  key: INFLUX_TOKEN
          ports:
            - containerPort: 8086
              name: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb2
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
