{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "apipark.fullname" . }}-ingress
  labels:
    {{- include "apipark.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.hosts.apipark.host }}
      http:
        paths:
          - path: {{ (index .Values.ingress.hosts.apipark.paths 0).path }}
            pathType: {{ (index .Values.ingress.hosts.apipark.paths 0).pathType }}
            backend:
              service:
                name: {{ include "apipark.fullname" . }}
                port:
                  number: {{ .Values.apipark.service.port | default 8288 }}
    {{- if .Values.apinto.enabled }}
    - host: {{ .Values.ingress.hosts.apinto.host }}
      http:
        paths:
          - path: {{ (index .Values.ingress.hosts.apinto.paths 0).path }}
            pathType: {{ (index .Values.ingress.hosts.apinto.paths 0).pathType }}
            backend:
              service:
                name: {{ .Release.Name }}-apinto
                port:
                  number: {{ .Values.config.apinto.httpPort | default 8099 }}
    {{- end }}
    {{- if .Values.grafana.enabled }}
    - host: {{ .Values.ingress.hosts.grafana.host }}
      http:
        paths:
          - path: {{ (index .Values.ingress.hosts.grafana.paths 0).path }}
            pathType: {{ (index .Values.ingress.hosts.grafana.paths 0).pathType }}
            backend:
              service:
                name: {{ .Release.Name }}-grafana
                port:
                  number: 3000
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
